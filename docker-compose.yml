# Runs the whole system locally: docker compose up --build
# Architecture: docs/architecture.md (the mid-term report's Figure 1).
#   Admin app        http://localhost:4200
#   API gateway      http://localhost:8000   (the only entry point)
#   Service API docs http://localhost:8001/docs (survey-manager),
#                    :8002/docs (respondent), :8003/docs (data-analyzer)
#                    Dev only: the services are published so their Swagger
#                    pages open; in production only the gateway is reachable.
#   RabbitMQ console http://localhost:15672

x-python-env: &python-env
  DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
  RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
  AUTH_MODE: ${AUTH_MODE:-dev}
  DEV_TENANT_ID: ${DEV_TENANT_ID}
  DEV_TENANT_NAME: ${DEV_TENANT_NAME}
  DEV_USER_ID: ${DEV_USER_ID}
  DEV_USER_NAME: ${DEV_USER_NAME}
  DEV_USER_EMAIL: ${DEV_USER_EMAIL}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 20

  # One-shot: applies backend/db/migrations as the schema owner.
  migrate:
    image: ghcr.io/amacneil/dbmate:2.21
    command: ["--wait", "--no-dump-schema", "up"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
    volumes: ["./backend/db:/db:ro"]
    depends_on:
      postgres: { condition: service_healthy }

  # One-shot: loads demo data (safe to run again).
  seed:
    image: postgres:16-alpine
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/db/seed/seed.sql"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes: ["./backend/db:/db:ro"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  # API gateway: routing, auth (dev: demo user), rate limiting.
  gateway:
    build: { context: backend/gateway }
    environment:
      DEV_TENANT_ID: ${DEV_TENANT_ID}
      DEV_TENANT_NAME: ${DEV_TENANT_NAME}
      DEV_USER_ID: ${DEV_USER_ID}
      DEV_USER_NAME: ${DEV_USER_NAME}
      DEV_USER_EMAIL: ${DEV_USER_EMAIL}
    ports: ["8000:8000"]
    depends_on:
      survey-manager: { condition: service_healthy }
      respondent: { condition: service_healthy }
      data-analyzer: { condition: service_healthy }

  # Surveys, questions, templates, publishing and links.
  survey-manager:
    build: { context: ., dockerfile: backend/survey-manager/Dockerfile }
    environment: *python-env
    ports: ["8001:8000"]
    depends_on:
      seed: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      retries: 20

  # Public answer path: verify link, queue the answer, thank-you page.
  respondent:
    build: { context: ., dockerfile: backend/respondent/Dockerfile }
    environment: *python-env
    ports: ["8002:8000"]
    depends_on:
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      retries: 20

  # Results (NPS/CSAT); sends identified answers and contact requests to the integration queue.
  data-analyzer:
    build: { context: ., dockerfile: backend/data-analyzer/Dockerfile }
    environment: *python-env
    ports: ["8003:8000"]
    depends_on:
      seed: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      retries: 20

  worker:
    build: { context: ., dockerfile: backend/worker/Dockerfile }
    environment: *python-env
    depends_on:
      rabbitmq: { condition: service_healthy }
      seed: { condition: service_completed_successfully }

  liana-connector:
    build: { context: ., dockerfile: backend/liana-connector/Dockerfile }
    environment:
      <<: *python-env
      LIANA_ADAPTER: ${LIANA_ADAPTER:-mock}
      LIANAAUTOMATION_BASE_URL: ${LIANAAUTOMATION_BASE_URL:-}
      LIANAAUTOMATION_CLIENT_ID: ${LIANAAUTOMATION_CLIENT_ID:-}
      LIANAAUTOMATION_CLIENT_SECRET: ${LIANAAUTOMATION_CLIENT_SECRET:-}
    depends_on:
      rabbitmq: { condition: service_healthy }

  # Production-style build of the React app, served by nginx.
  # For day-to-day frontend work use `npm run dev` in frontend instead.
  admin-web:
    build: { context: frontend }
    ports: ["4200:80"]
    depends_on:
      gateway: { condition: service_healthy }

volumes:
  pgdata:
