# Runs the whole system locally: docker compose up --build
# Admin app: http://localhost:4200   API docs: http://localhost:8000/docs
# RabbitMQ console: http://localhost:15672

x-python-env: &python-env
  DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
  RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
  AUTH_MODE: ${AUTH_MODE:-dev}
  DEV_TENANT_ID: ${DEV_TENANT_ID}
  DEV_TENANT_NAME: ${DEV_TENANT_NAME}
  DEV_USER_ID: ${DEV_USER_ID}
  DEV_USER_NAME: ${DEV_USER_NAME}
  DEV_USER_EMAIL: ${DEV_USER_EMAIL}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 20

  # One-shot: applies db/migrations as the schema owner.
  migrate:
    image: ghcr.io/amacneil/dbmate:2.21
    command: ["--wait", "--no-dump-schema", "up"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
    volumes: ["./db:/db:ro"]
    depends_on:
      postgres: { condition: service_healthy }

  # One-shot: loads demo data (safe to run again).
  seed:
    image: postgres:16-alpine
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/db/seed/seed.sql"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes: ["./db:/db:ro"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  api:
    build: { context: ., dockerfile: services/api/Dockerfile }
    environment: *python-env
    ports: ["8000:8000"]
    depends_on:
      seed: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      retries: 20

  worker:
    build: { context: ., dockerfile: services/worker/Dockerfile }
    environment: *python-env
    depends_on:
      rabbitmq: { condition: service_healthy }
      seed: { condition: service_completed_successfully }

  liana-connector:
    build: { context: ., dockerfile: services/liana-connector/Dockerfile }
    environment:
      <<: *python-env
      LIANA_ADAPTER: ${LIANA_ADAPTER:-mock}
      LIANAAUTOMATION_BASE_URL: ${LIANAAUTOMATION_BASE_URL:-}
      LIANAAUTOMATION_CLIENT_ID: ${LIANAAUTOMATION_CLIENT_ID:-}
      LIANAAUTOMATION_CLIENT_SECRET: ${LIANAAUTOMATION_CLIENT_SECRET:-}
    depends_on:
      rabbitmq: { condition: service_healthy }

  # Production-style build of the React app, served by nginx.
  # For day-to-day frontend work use `npm run dev` in apps/admin-web instead.
  admin-web:
    build: { context: apps/admin-web }
    ports: ["4200:80"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
