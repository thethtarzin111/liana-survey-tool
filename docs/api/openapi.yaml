openapi: 3.1.0
info:
  title: LianaSurvey API
  version: 0.1.0
  description: |
    The contract between the admin app and the backend. Update it in the same
    pull request as any endpoint change. FastAPI also serves its generated
    version at /openapi.json; this file is the reviewed, hand-kept contract.
    All calls go through the API gateway (backend/scripts/local_gateway.py), which routes them:
    /api/v1/me is answered by the gateway itself (dev auth), /api/v1/surveys
    and /api/v1/templates by survey-manager, /api/v1/results by data-analyzer,
    and /r/<token> by the respondent service. The service of each path is in
    its tag. /health and /health/ready also exist on every service.
servers:
  - url: http://localhost:8000
    description: Local development API gateway
paths:
  /health:
    get:
      tags: [health]
      summary: Liveness (process is up)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
  /health/ready:
    get:
      tags: [health]
      summary: Readiness (database reachable)
      responses:
        '200': { description: Ready }
        '503': { description: Database unreachable }
  /api/v1/me:
    get:
      tags: [auth]
      summary: The signed-in user (demo user in dev mode). Answered by the gateway.
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
  /api/v1/surveys:
    get:
      tags: [surveys]
      summary: List the organisation's surveys, most recently changed first
      description: Both filters are optional and can be combined.
      parameters:
        - name: q
          in: query
          required: false
          description: Text anywhere in the title, ignoring case and surrounding spaces. % and _ match literally.
          schema: { type: string, maxLength: 200 }
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/SurveyStatus' }
      responses:
        '200':
          description: Surveys with their answer counts
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SurveyListItem' } }
        '422': { description: Unknown status or search text over 200 characters }
    post:
      tags: [surveys]
      summary: Create a survey (always a draft)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SurveyCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Survey' }
        '422': { description: Invalid body (unknown type, blank or long title, long description, or a field the server sets) }
  /api/v1/surveys/{survey_id}:
    parameters:
      - { name: survey_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [surveys]
      summary: One survey
      responses:
        '200':
          description: Survey
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Survey' }
        '404': { description: No such survey in this organisation }
    patch:
      tags: [surveys]
      summary: Change the title, description or type; omitted fields stay the same
      description: Leave out fields that should not change. Sending a field as null is a 422.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SurveyUpdate' }
      responses:
        '200':
          description: Updated survey
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Survey' }
        '404': { description: No such survey in this organisation }
        '422': { description: Invalid body }
    delete:
      tags: [surveys]
      summary: Delete a survey with its questions, responses and answers
      description: This cannot be undone. Close the survey instead to keep its results.
      responses:
        '204': { description: Deleted }
        '404': { description: No such survey in this organisation }
  /api/v1/surveys/{survey_id}/duplicate:
    parameters:
      - { name: survey_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [surveys]
      summary: Copy a survey and its questions into a new draft
      description: >-
        The copy is called "<title> (copy)", shortened to fit 200 characters. Open and close
        dates are cleared; responses, contact requests and results are not copied.
      responses:
        '201':
          description: The new draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Survey' }
        '404': { description: No such survey in this organisation }
  /api/v1/surveys/{survey_id}/close:
    parameters:
      - { name: survey_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [surveys]
      summary: Close a live survey so it no longer takes answers
      responses:
        '200':
          description: The closed survey
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Survey' }
        '404': { description: No such survey in this organisation }
        '409': { description: The survey is not live }
  /api/v1/surveys/{survey_id}/unpublish:
    parameters:
      - { name: survey_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [surveys]
      summary: Turn a live or scheduled survey back into a draft
      responses:
        '200':
          description: The survey, now a draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Survey' }
        '404': { description: No such survey in this organisation }
        '409': { description: The survey is not live or scheduled }
components:
  schemas:
    CurrentUser:
      type: object
      required: [user_id, tenant_id, tenant_name, name, email]
      properties:
        user_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        tenant_name: { type: string, example: Example Members Association }
        name: { type: string, example: Anna Virtanen }
        email: { type: string, format: email }
    SurveyType:
      type: string
      enum: [thumbs, nps, csat, custom]
      description: thumbs = thumbs rating, nps = 0-10, csat = 1-5, custom = start from scratch
    SurveyStatus:
      type: string
      enum: [draft, scheduled, live, closed]
    SurveyCreate:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { $ref: '#/components/schemas/SurveyType' }
        title: { type: string, minLength: 1, maxLength: 200, default: Untitled survey, description: Trimmed }
        description: { type: [string, 'null'], maxLength: 1000, description: Trimmed; an empty string is stored as null }
    SurveyUpdate:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 1000, description: Trimmed; an empty string clears the description }
        type: { $ref: '#/components/schemas/SurveyType' }
    Survey:
      type: object
      required: [id, title, description, type, status, anonymous, language, opens_at, closes_at, response_limit, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, example: Member NPS 2026 }
        description: { type: [string, 'null'], example: Members' view of 2026 }
        type: { $ref: '#/components/schemas/SurveyType' }
        status: { $ref: '#/components/schemas/SurveyStatus' }
        anonymous: { type: boolean, description: True unless respondents opt in to be identified }
        language: { type: string, enum: [en, fi, sv] }
        opens_at: { type: [string, 'null'], format: date-time }
        closes_at: { type: [string, 'null'], format: date-time }
        response_limit: { type: [integer, 'null'], minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SurveyListItem:
      description: A survey on the Surveys list
      allOf:
        - { $ref: '#/components/schemas/Survey' }
        - type: object
          required: [answers]
          properties:
            answers: { type: integer, minimum: 0, description: Submitted responses so far }
