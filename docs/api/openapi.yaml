openapi: 3.1.0
info:
  title: LianaSurvey API
  version: 0.1.0
  description: |
    The contract between the admin app and the backend. Update it in the same
    pull request as any endpoint change. FastAPI also serves its generated
    version at /openapi.json; this file is the reviewed, hand-kept contract.
    All calls go through the API gateway (backend/scripts/local_gateway.py), which routes them:
    /api/v1/me is answered by the gateway itself (dev auth), /api/v1/surveys
    and /api/v1/templates by survey-manager, /api/v1/results by data-analyzer,
    and /r/<token> by the respondent service. The service of each path is in
    its tag. /health and /health/ready also exist on every service.
servers:
  - url: http://localhost:8000
    description: Local development API gateway
paths:
  /health:
    get:
      tags: [health]
      summary: Liveness (process is up)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
  /health/ready:
    get:
      tags: [health]
      summary: Readiness (database reachable)
      responses:
        '200': { description: Ready }
        '503': { description: Database unreachable }
  /api/v1/me:
    get:
      tags: [auth]
      summary: The signed-in user (demo user in dev mode). Answered by the gateway.
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
  /api/v1/surveys:
    get:
      tags: [surveys]
      summary: List the organisation's surveys, most recently changed first
      description: Both filters are optional and can be combined.
      parameters:
        - name: q
          in: query
          required: false
          description: Text anywhere in the title, ignoring case and surrounding spaces. % and _ match literally.
          schema: { type: string, maxLength: 200 }
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/SurveyStatus' }
      responses:
        '200':
          description: Surveys with their answer counts
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SurveyListItem' } }
        '422': { description: Unknown status or search text over 200 characters }
    post:
      tags: [surveys]
      summary: Create a survey (always a draft)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SurveyCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Survey' }
        '422': { description: Invalid body (unknown type, blank or long title, long description, or a field the server sets) }
  /api/v1/surveys/{survey_id}:
    parameters:
      - { name: survey_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [surveys]
      summary: One survey
      responses:
        '200':
          description: Survey
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Survey' }
        '404': { description: No such survey in this organisation }
    patch:
      tags: [surveys]
      summary: Change the survey's fields and settings; omitted fields stay the same
      description: >-
        Leave out fields that should not change. Sending a field as null is a 422, except
        closes_at and response_limit, where null removes the close date or the limit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SurveyUpdate' }
      responses:
        '200':
          description: Updated survey
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Survey' }
        '404': { description: No such survey in this organisation }
        '422': { description: 'Invalid body, or a close date that is not in the future' }
    delete:
      tags: [surveys]
      summary: Delete a survey with its questions, responses and answers
      description: This cannot be undone. Close the survey instead to keep its results.
      responses:
        '204': { description: Deleted }
        '404': { description: No such survey in this organisation }
  /api/v1/surveys/{survey_id}/duplicate:
    parameters:
      - { name: survey_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [surveys]
      summary: Copy a survey and its questions into a new draft
      description: >-
        The copy is called "<title> (copy)", shortened to fit 200 characters. Open and close
        dates are cleared; responses, contact requests and results are not copied.
      responses:
        '201':
          description: The new draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Survey' }
        '404': { description: No such survey in this organisation }
  /api/v1/surveys/{survey_id}/publish:
    parameters:
      - { name: survey_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [surveys]
      summary: Make a draft live and give it its public link
      description: >-
        The survey needs at least one question; thumbs, NPS and CSAT surveys need their main
        question (thumbs, nps or rating) first. Every question needs its text (reason bubbles
        have none). The public token is set on the first publish and
        kept, so links already sent keep working after unpublishing and publishing again.
      responses:
        '200':
          description: The live survey, with public_url
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Survey' }
        '404': { description: No such survey in this organisation }
        '409': { description: 'Not a draft, missing its questions, or a question without text; detail says which' }
  /api/v1/surveys/{survey_id}/test-links:
    parameters:
      - { name: survey_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [surveys]
      summary: Signed answer links for made-up readers (local development only)
      description: >-
        To try a live survey as different readers without sending a newsletter. Only with AUTH_MODE=dev;
        404 otherwise. Add &a=<answer> to answer the main question, e.g. &a=9 for NPS.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                count: { type: integer, minimum: 1, maximum: 20, default: 3 }
      responses:
        '200':
          description: One link per test reader
          content:
            application/json:
              schema:
                type: object
                required: [links]
                properties:
                  links:
                    type: array
                    items: { type: string, example: 'http://localhost:8000/r/hmZXsmjjAuMpgevPRmIhdA?r=test-da836f-1&s=aEIY...' }
        '404': { description: No such survey, or not in local development }
        '409': { description: The survey is not live }
  /api/v1/surveys/{survey_id}/snippet:
    parameters:
      - { name: survey_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [surveys]
      summary: LianaMailer newsletter snippet (#40)
      description: >-
        The HTML block to paste into a LianaMailer newsletter: the survey's main question and one
        link per answer (thumbs, NPS or CSAT). Plain tables and inline styles. Each link carries
        LianaMailer's contact id placeholder (MAILER_READER_TAG, default $id$) as the reader, so
        each reader counts once, plus the campaign and segment tags. The links are not signed (a
        pasted snippet is the same for every reader); see #118. Making a snippet sets the survey's
        newsletter_links, and only such surveys accept unsigned links. Make one snippet per segment.
      parameters:
        - name: campaign
          in: query
          required: false
          description: Campaign tag; default the survey name as a slug
          schema: { type: string, pattern: '^[a-z0-9](?:[a-z0-9-]{0,38}[a-z0-9])?$', example: member-nps-2026 }
        - name: segment
          in: query
          required: false
          description: Segment tag. none and other are reserved (they are the Results filter values) and give 422.
          schema: { type: string, pattern: '^[a-z0-9](?:[a-z0-9-]{0,38}[a-z0-9])?$', default: all, example: members }
      responses:
        '200':
          description: The snippet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Snippet' }
        '404': { description: No such survey }
        '409': { description: The survey is not live, is a custom survey, or has no main question }
        '422': { description: A tag is not a lower-case slug of 1-40 characters }
  /api/v1/surveys/{survey_id}/close:
    parameters:
      - { name: survey_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [surveys]
      summary: Close a live survey so it no longer takes answers
      responses:
        '200':
          description: The closed survey
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Survey' }
        '404': { description: No such survey in this organisation }
        '409': { description: The survey is not live }
  /api/v1/surveys/{survey_id}/unpublish:
    parameters:
      - { name: survey_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [surveys]
      summary: Turn a live or scheduled survey back into a draft
      responses:
        '200':
          description: The survey, now a draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Survey' }
        '404': { description: No such survey in this organisation }
        '409': { description: The survey is not live or scheduled }
  /api/v1/surveys/{survey_id}/logo:
    parameters:
      - { name: survey_id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [surveys]
      summary: Upload or replace the survey's logo
      description: >-
        Send the image itself as the body, with its Content-Type. PNG, JPEG, SVG or WebP, at most
        1 MB. The bytes must match the type. SVGs with scripts, event handlers, javascript: links
        or foreignObject are refused.
      requestBody:
        required: true
        content:
          image/png: { schema: { type: string, format: binary } }
          image/jpeg: { schema: { type: string, format: binary } }
          image/svg+xml: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        '200':
          description: The survey, with its new logo_url
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Survey' }
        '404': { description: No such survey in this organisation }
        '413': { description: Larger than 1 MB }
        '415': { description: Not an accepted image, or the bytes do not match the type }
    get:
      tags: [surveys]
      summary: The survey's logo image
      description: Served with a strict Content-Security-Policy (sandbox) and nosniff, so it cannot run code.
      responses:
        '200':
          description: The image
          content:
            image/png: {}
            image/jpeg: {}
            image/svg+xml: {}
            image/webp: {}
        '404': { description: No such survey, or it has no logo }
    delete:
      tags: [surveys]
      summary: Remove the logo (also 204 when there is none)
      responses:
        '204': { description: Removed }
        '404': { description: No such survey in this organisation }
  /api/v1/surveys/{survey_id}/questions:
    parameters:
      - { name: survey_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [questions]
      summary: List a survey's questions in their saved order
      responses:
        '200':
          description: Questions
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Question' } }
        '404': { description: No such survey in this organisation }
    post:
      tags: [questions]
      summary: Add a question at the end of a survey
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuestionCreate' }
      responses:
        '201':
          description: Added question
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Question' }
        '404': { description: No such survey in this organisation }
        '422': { description: Invalid question, or options that do not fit its type }
  /api/v1/surveys/{survey_id}/questions/order:
    parameters:
      - { name: survey_id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [questions]
      summary: Replace the question order atomically
      description: question_ids must contain every question in this survey exactly once.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuestionOrder' }
      responses:
        '200':
          description: Questions in their new order
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Question' } }
        '404': { description: No such survey in this organisation }
        '422': { description: Missing, extra, or duplicate question id }
  /api/v1/surveys/{survey_id}/questions/{question_id}:
    parameters:
      - { name: survey_id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: question_id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [questions]
      summary: Edit a question; omitted fields stay the same
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuestionUpdate' }
      responses:
        '200':
          description: Updated question
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Question' }
        '404': { description: No such survey or question in this organisation }
        '422': { description: Invalid question, or options that do not fit its type }
    delete:
      tags: [questions]
      summary: Delete a question and close the position gap
      responses:
        '204': { description: Deleted }
        '404': { description: No such survey or question in this organisation }
  /api/v1/surveys/{survey_id}/questions/{question_id}/duplicate:
    parameters:
      - { name: survey_id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: question_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [questions]
      summary: Copy a question into the next position
      responses:
        '201':
          description: Duplicated question
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Question' }
        '404': { description: No such survey or question in this organisation }
  /api/v1/templates:
    get:
      tags: [templates]
      summary: Built-in templates and the organisation's own, in display order
      description: >-
        Built-in templates come first in their set order, then the organisation's own by
        name. "{organisation}" in template text is replaced with the organisation's name.
      parameters:
        - name: type
          in: query
          required: false
          description: Only templates of this survey type, as on "Pick a template"
          schema: { $ref: '#/components/schemas/SurveyType' }
      responses:
        '200':
          description: Templates
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Template' } }
        '422': { description: Unknown survey type }
    post:
      tags: [templates]
      summary: Save a survey as the organisation's own template
      description: >-
        The template gets the survey's type, thank-you message and questions, with the name
        and description sent here. Only the organisation sees it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateCreate' }
      responses:
        '201':
          description: The new template
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        '404': { description: No such survey in this organisation }
        '409': { description: The survey has no questions yet }
        '422': { description: Invalid body }
  /api/v1/templates/{template_id}:
    parameters:
      - { name: template_id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [templates]
      summary: Rename one of the organisation's own templates or change its description
      description: Leave out fields that should not change. Sending a field as null is a 422.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateUpdate' }
      responses:
        '200':
          description: Updated template
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        '403': { description: Built-in templates cannot be changed }
        '404': { description: No such template for this organisation }
        '422': { description: Invalid body }
    delete:
      tags: [templates]
      summary: Delete one of the organisation's own templates
      description: Surveys made from the template stay.
      responses:
        '204': { description: Deleted }
        '403': { description: Built-in templates cannot be deleted }
        '404': { description: No such template for this organisation }
  /api/v1/templates/{template_id}/surveys:
    parameters:
      - { name: template_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [templates]
      summary: Create a draft survey from a template
      description: The survey gets the template's name as its title, its type, thank-you message and questions.
      responses:
        '201':
          description: The new draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Survey' }
        '404': { description: No such template for this organisation }
  /api/v1/results/performance:
    get:
      tags: [results]
      summary: Survey views, responses and response rate by distribution channel
      description: >-
        Response rate is responses divided by views; it is null before the first view. A reader
        counts as one view however often they tap. Each row's main result counts only that
        channel's answers. Surveys with the latest view or answer come first.
      parameters:
        - name: limit
          in: query
          required: false
          description: "Surveys to include, all when left out. Counts surveys, not rows: a survey's channels stay together."
          schema: { type: integer, minimum: 1, maximum: 100 }
        - { name: offset, in: query, required: false, description: Surveys to skip, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Used email, public-link and QR channels, updated as views and answers arrive
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PerformanceRow' } }
        '422':
          description: limit or offset out of range
  /api/v1/results/{survey_id}/overview:
    get:
      tags: [results]
      summary: Overview of one survey's results
      description: >-
        KPIs, a summary per question in question order, top reasons, the main score by month and by
        segment. The main question is the first nps, thumbs or rating question. Months are calendar
        months in Europe/Helsinki. Segments follow the anonymity rules: a segment with fewer than 5
        answers is never shown alone, its answers are grouped into "other", and "other" is left out
        when it has fewer than 5. Segments are on only when 2 or more shown groups cover every response, otherwise `segments` and `by_segment` are empty and any segment other than `all` is 400, so a hidden size cannot be found by subtraction. `none` is the filter value for answers without a segment. With a
        segment chosen every number is limited to it, and response_rate is null because views are
        counted per channel.
      parameters:
        - { name: survey_id, in: path, required: true, schema: { type: string, format: uuid } }
        - name: segment
          in: query
          required: false
          description: "`all` (default) for no filter, or a `value` from `segments`"
          schema: { type: string, default: all }
      responses:
        '200':
          description: The overview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SurveyOverview' }
        '400': { description: 'Segment not available: unknown, or too small to show' }
        '404': { description: Survey not found }
        '422': { description: survey_id is not a UUID }
  /api/v1/results/{survey_id}/comment-insights:
    get:
      tags: [results]
      summary: Themes in one survey's comments
      description: >-
        Comments to the survey's first text question, with emails and phone numbers hidden before
        anything reads them. With fewer than `min_comments` (5) comments `status` is `too_few` and
        there are no themes. With fewer than `direct_limit` (50) the theme writer (an LLM, or the mock)
        reads them in one batch (`mode: direct`); from 50 the grouper embeds and clusters them first
        and the writer is called once per group (`mode: clustered`). The writer only names themes,
        summaries and quotes. Every count, percentage and score is computed in code; sentiment comes
        from the reader's score and from the writer only for mixed scores (NPS 7-8, thumbs Good,
        rating 3). A quote is kept only when it is found word-for-word in its comment. Segments
        follow the overview's rules.
      parameters:
        - { name: survey_id, in: path, required: true, schema: { type: string, format: uuid } }
        - name: segment
          in: query
          required: false
          description: "`all` (default) for no filter, or a `value` from the overview's `segments`"
          schema: { type: string, default: all }
      responses:
        '200':
          description: The themes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentInsights' }
        '400': { description: 'Segment not available: unknown, or too small to show' }
        '404': { description: Survey not found }
        '422': { description: survey_id is not a UUID }
  /api/v1/results/{survey_id}/responses:
    get:
      tags: [results]
      summary: Responses of one survey, newest first
      description: >-
        Answer, reason and comment are those of the first scale, reasons and text question.
        Emails and phone numbers in comments are replaced with `[hidden]` in the same query, so
        `q`, `total` and paging only see the hidden text. `segment_label` is null when segments
        are off (see the overview); small segments are labelled "Other" and answers without a
        segment "No segment". The contact reference and the link key are never returned.
      parameters:
        - { name: survey_id, in: path, required: true, schema: { type: string, format: uuid } }
        - name: segment
          in: query
          required: false
          description: "`all` (default) for no filter, or a `value` from the overview's `segments`"
          schema: { type: string, default: all }
        - name: q
          in: query
          required: false
          description: Text to find in the comments after emails and phone numbers are hidden
          schema: { type: string }
        - name: group
          in: query
          required: false
          description: >-
            Answer group of the survey's first scale question. Thumbs: not-for-me, good, loved-it.
            NPS: detractors, passives, promoters. Rating: low (1-2), neutral (3), high (4-5).
          schema: { type: string }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: One page of responses and how many match
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResponsesPage' }
        '400': { description: 'Segment not available: unknown, too small to show, or segments are off' }
        '404': { description: Survey not found }
        '422': { description: Unknown answer group for this survey, limit or offset out of range, or survey_id is not a UUID }
  /api/v1/results/{survey_id}/responses.csv:
    get:
      tags: [results]
      summary: Export the matching responses as CSV
      description: >-
        All matching responses (not one page), newest first, with the same filters and masking as
        the list. Columns are ID, Received (Europe/Helsinki), Segment and one per question in
        question order. Multiple choices are joined with "; ". Text starting with =, +, - or @ gets
        a leading apostrophe so a spreadsheet does not run it. Segment is empty when segments are off.
      parameters:
        - { name: survey_id, in: path, required: true, schema: { type: string, format: uuid } }
        - name: segment
          in: query
          required: false
          description: "`all` (default) for no filter, or a `value` from the overview's `segments`"
          schema: { type: string, default: all }
        - name: q
          in: query
          required: false
          description: Text to find in the comments after emails and phone numbers are hidden
          schema: { type: string }
        - name: group
          in: query
          required: false
          description: >-
            Answer group of the survey's first scale question. Thumbs: not-for-me, good, loved-it.
            NPS: detractors, passives, promoters. Rating: low (1-2), neutral (3), high (4-5).
          schema: { type: string }
      responses:
        '200':
          description: The CSV file
          content:
            text/csv:
              schema: { type: string }
        '400': { description: 'Segment not available: unknown, too small to show, or segments are off' }
        '404': { description: Survey not found }
        '422': { description: Unknown answer group for this survey, or survey_id is not a UUID }
  /api/v1/results/{survey_id}/responses/{response_id}:
    get:
      tags: [results]
      summary: Every answer of one response
      description: Answers in question order, text masked like the list. A question without an answer has a null value.
      parameters:
        - { name: survey_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: response_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResponseDetail' }
        '404': { description: Survey or response not found }
        '422': { description: An id is not a UUID }
  /r/{link_token}:
    get:
      tags: [respondent]
      summary: Answer link from the email, or the survey link page (public, no login)
      description: >-
        With r and a, a one-tap answer link from the email. Signed links carry the reader and
        its signature (s). Newsletter snippet links (#40) have no signature: the reader is the
        contact id LianaMailer filled in, and an unreplaced placeholder such as $id$ is refused.
        Only surveys with newsletter_links accept them. Records the answer to the survey's main
        question (thumbs 0-2, NPS 0-10, CSAT 1-5), puts it on the survey.answers queue for the
        worker, and returns a plain HTML thank-you page with the survey's thank-you message.
        Answers stay anonymous: only a key derived from the reader is stored, so each reader counts
        once. A reader's later tap replaces their earlier answer (#126), so a mail scanner opening
        every link before the reader does not decide the answer.
        Without r, s and a (the plain public link, copied or from the QR code), returns the survey
        link page (#105): the reader title (custom surveys: the survey title), the description and
        every question, as an HTML form that posts to the same address. Each visit gets a new
        signed visit key. The visit counts toward the ch channel's views.
        Pages are sent with Cache-Control no-store and Referrer-Policy no-referrer. Once the survey
        is found, its fixed texts (headings, buttons, default and error messages) are in the
        survey's language.
      parameters:
        - { name: link_token, in: path, required: true, schema: { type: string } }
        - { name: r, in: query, required: false, description: Reader reference (answer links), schema: { type: string } }
        - { name: s, in: query, required: false, description: Signature of the token and reader; none on newsletter snippet links, schema: { type: string } }
        - { name: c, in: query, required: false, description: Campaign tag (newsletter snippet links), schema: { type: string } }
        - { name: seg, in: query, required: false, description: 'Segment tag (newsletter snippet links), default all. Lowercase letters, digits and hyphens; none and other are reserved. An invalid tag shows the incomplete-link page (400).', schema: { type: string, pattern: '^[a-z0-9](?:[a-z0-9-]{0,38}[a-z0-9])?$', default: all } }
        - { name: a, in: query, required: false, description: The tapped answer (answer links), schema: { type: integer } }
        - { name: ch, in: query, required: false, description: 'Distribution channel for survey performance (email, link or qr). Without it, an answer link counts as email and a plain visit as link.', schema: { type: string, enum: [email, link, qr] } }
      responses:
        '200': { description: 'Thank-you page, or the survey link page for the plain public link (HTML)', content: { text/html: {} } }
        '400': { description: 'Link not complete or not valid, or an answer that is not one of the choices (HTML)' }
        '403': { description: The survey is not open yet, or has no questions (HTML) }
        '404': { description: Unknown link (HTML) }
        '410': { description: The survey is closed, or has reached its response limit (HTML) }
        '503': { description: The answer could not be queued; the reader is asked to try again (HTML) }
    post:
      tags: [respondent]
      summary: Answers from the survey link page (public, no login)
      description: >-
        The form on the survey link page (#105). Checks every answer against its question
        (required questions, choices, scales, text length; thumbs surveys only take reasons after
        "Not for me"), puts them on the survey.answers queue with the visit's channel, and returns
        the thank-you page. Answers that do not fit show the form again with the reader's answers
        and what to fix (400). The visit key counts the reader once: sending the form again from
        the same visit replaces the earlier answers. Close date and response limit apply as for
        answer links.
      parameters:
        - { name: link_token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [key]
              properties:
                key: { type: string, description: The signed visit key from the page }
                ch: { type: string, enum: [link, qr], default: link }
              additionalProperties:
                description: 'q-<question id>: the answer; repeated for each picked option'
                type: array
                items: { type: string }
      responses:
        '200': { description: Thank-you page (HTML), content: { text/html: {} } }
        '400': { description: 'Missing or invalid visit key, or answers that do not fit: the form again, with what to fix (HTML)' }
        '403': { description: The survey is not open yet (HTML) }
        '404': { description: Unknown link (HTML) }
        '410': { description: The survey is closed, or has reached its response limit (HTML) }
        '413': { description: The form is too large (HTML) }
        '503': { description: The answers could not be queued; the reader is asked to try again (HTML) }
components:
  schemas:
    CurrentUser:
      type: object
      required: [user_id, tenant_id, tenant_name, name, email]
      properties:
        user_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        tenant_name: { type: string, example: Example Members Association }
        name: { type: string, example: Anna Virtanen }
        email: { type: string, format: email }
    Snippet:
      type: object
      required: [campaign, segment, html]
      properties:
        campaign: { type: string, example: member-nps-2026 }
        segment: { type: string, example: members }
        html: { type: string, description: 'Plain HTML with inline styles: the main question and one link per answer' }
    SurveyType:
      type: string
      enum: [thumbs, nps, csat, custom]
      description: thumbs = thumbs rating, nps = 0-10, csat = 1-5, custom = start from scratch
    SurveyStatus:
      type: string
      enum: [draft, scheduled, live, closed]
    SurveyCreate:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { $ref: '#/components/schemas/SurveyType' }
        title: { type: string, minLength: 1, maxLength: 80, default: Untitled survey, description: Trimmed }
        description: { type: [string, 'null'], maxLength: 1000, description: Trimmed; an empty string is stored as null }
    SurveyUpdate:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 80 }
        reader_title: { type: string, maxLength: 80, description: 'Template surveys: the title readers see on the survey link page (#105), as the name stays private. Trimmed; an empty string clears it' }
        description: { type: string, maxLength: 1000, description: 'Trimmed; an empty string clears the description. Shown to readers on the survey link page (#105)' }
        thank_you: { type: string, maxLength: 500, description: Trimmed; an empty string clears the message }
        type: { $ref: '#/components/schemas/SurveyType' }
        language: { type: string, enum: [en, fi, sv], description: 'Language of the fixed texts readers see: thank-you and closed pages, thumbs button labels in the snippet' }
        comment_field: { type: boolean, description: 'Reader option: optional "Tell us more" field after any answer' }
        show_results: { type: boolean, description: 'Reader option: show results to readers (after about 10 answers)' }
        contact_opt_in: { type: boolean, description: 'Reader option: "Contact me about this by email" opt-in' }
        accent_color: { type: string, pattern: '^#?[0-9A-Fa-f]{6}$', description: 'Branding: buttons and highlights. Stored as "#RRGGBB"' }
        background_color: { type: string, pattern: '^#?[0-9A-Fa-f]{6}$', description: 'Branding: page background. Stored as "#RRGGBB"' }
        closes_at: { type: [string, 'null'], format: date-time, description: 'Setting: no answers after this time; must be in the future and include a time zone; null removes it' }
        response_limit: { type: [integer, 'null'], minimum: 1, maximum: 1000000, description: 'Setting: no new readers once this many have answered (a reader can still change their answer); null removes it' }
        notify_on_response: { type: boolean, description: 'Setting: "Notify me of new responses by email". Stored only; the emails are #128' }
    Survey:
      type: object
      required: [id, title, description, thank_you, type, status, anonymous, comment_field, show_results, contact_opt_in, accent_color, background_color, logo_url, public_url, published_at, language, opens_at, closes_at, response_limit, notify_on_response, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, example: Member NPS 2026 }
        reader_title: { type: [string, 'null'], description: 'Template surveys: the title readers see on the survey link page; custom surveys show their title', example: 'How did you like this newsletter?' }
        description: { type: [string, 'null'], example: Members' view of 2026 }
        thank_you: { type: [string, 'null'], description: Shown to readers after answering, example: Thank you. This takes our member work forward. }
        type: { $ref: '#/components/schemas/SurveyType' }
        status: { $ref: '#/components/schemas/SurveyStatus' }
        anonymous: { type: boolean, description: True unless respondents opt in to be identified }
        comment_field: { type: boolean, description: 'Reader option, default true: optional "Tell us more" field' }
        show_results: { type: boolean, description: 'Reader option, default true: readers see results after answering' }
        contact_opt_in:
          type: boolean
          description: >-
            Reader option, default true: readers may tick "Contact me about this by email".
            Answers stay anonymous unless they do; then a contact request is created with a
            contact reference, never an e-mail address.
        accent_color: { type: string, pattern: '^#[0-9A-F]{6}$', example: '#0F6A5E', description: Default Teal (#0F6A5E) }
        background_color: { type: string, pattern: '^#[0-9A-F]{6}$', example: '#FFFFFF', description: Default White (#FFFFFF) }
        public_url:
          type: [string, 'null']
          description: >-
            The survey's public link (/r/<token>) once it has been published, else null. Answer
            links add the reader (r), its signature (s) and the answer (a).
          example: https://survey.example.eu/r/hmZXsmjjAuMpgevPRmIhdA
        published_at: { type: [string, 'null'], format: date-time, description: When it was last published }
        newsletter_links: { type: boolean, description: 'A newsletter snippet was made, so unsigned snippet links are accepted (#40)' }
        logo_url:
          type: [string, 'null']
          description: Where to load the logo from (changes with every upload), or null when there is none
          example: /api/v1/surveys/9f1c.../logo?v=1794870174
        language: { type: string, enum: [en, fi, sv], description: 'Language of the fixed texts readers see (English, suomi, svenska); default en' }
        opens_at: { type: [string, 'null'], format: date-time }
        closes_at: { type: [string, 'null'], format: date-time }
        response_limit: { type: [integer, 'null'], minimum: 1 }
        notify_on_response: { type: boolean, description: '"Notify me of new responses by email" (#47)' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SurveyListItem:
      # answer_counts exposes only anonymous aggregate counts for dashboard charts.
      description: A survey on the Surveys list
      allOf:
        - { $ref: '#/components/schemas/Survey' }
        - type: object
          required: [answers, headline, answer_counts]
          properties:
            answer_counts:
              type: object
              additionalProperties: { type: integer, minimum: 0 }
              description: Anonymous main-question counts used by dashboard distribution charts
            answers: { type: integer, minimum: 0, description: Submitted responses so far }
            last_answer_at: { type: [string, 'null'], format: date-time, description: When the newest response arrived; null before the first }
            headline:
              type: [object, 'null']
              description: >-
                The "Headline score" for thumbs, NPS and CSAT surveys, worded as in the prototype
                (liana_survey_shared.scoring); null for custom surveys and before the first answer.
              required: [score, note]
              properties:
                score: { type: string, example: NPS +42 }
                note: { type: string, example: scale −100 to +100 }
    PerformanceRow:
      type: object
      required: [survey_id, survey, channel, views, responses, response_rate, main_result]
      properties:
        survey_id: { type: string, format: uuid }
        survey: { type: string }
        channel: { type: string, enum: [email, link, qr] }
        views: { type: integer, minimum: 0 }
        responses: { type: integer, minimum: 0 }
        response_rate: { type: [integer, 'null'], minimum: 0, description: Responses divided by views, as a whole percentage }
        main_result: { type: [string, 'null'], example: NPS +42 }
    CommentInsights:
      type: object
      required: [survey_id, status, mode, kind, comments, redacted, min_comments, direct_limit, score, themes, negative_themes, run]
      properties:
        survey_id: { type: string, format: uuid }
        status: { type: string, enum: [ready, too_few] }
        mode: { type: [string, 'null'], enum: [direct, clustered, null] }
        kind: { type: [string, 'null'], enum: [nps, thumbs, rating, null], description: The main scale question's kind }
        comments: { type: integer, minimum: 0 }
        redacted: { type: integer, minimum: 0, description: Comments with an email or phone number hidden }
        min_comments: { type: integer, example: 5 }
        direct_limit: { type: integer, example: 50 }
        score: { type: [integer, 'null'], description: Main score of everyone who commented; null with fewer than 5 scored answers }
        themes:
          type: array
          description: Most comments first, Other last
          items:
            type: object
            required: [key, label, outlier, comments, percent, sentiment, score, score_vs_all, quotes, hidden_quotes, samples]
            properties:
              key: { type: string, example: price }
              label: { type: string, description: Named by the theme writer, example: Price }
              outlier: { type: boolean, description: 'True for "Other": comments that fit no theme' }
              comments: { type: integer }
              percent: { type: [integer, 'null'], description: Share of all comments }
              sentiment:
                type: object
                required: [negative, neutral, positive]
                properties:
                  negative: { type: integer }
                  neutral: { type: integer }
                  positive: { type: integer }
              score: { type: [integer, 'null'], description: Main score of these commenters; null with fewer than 5 scored answers }
              score_vs_all: { type: [integer, 'null'], description: score minus the score of all commenters }
              quotes:
                type: array
                maxItems: 3
                items:
                  type: object
                  required: [comment_id, text, summary]
                  properties:
                    comment_id: { type: string, example: C1 }
                    text: { type: string, description: Found word-for-word in the redacted comment }
                    summary: { type: string }
              hidden_quotes: { type: integer, description: Suggested quotes not found word-for-word }
              samples: { type: array, maxItems: 5, items: { type: string }, description: Redacted comments }
        negative_themes:
          type: array
          maxItems: 3
          items:
            type: object
            required: [key, label, count, percent]
            properties:
              key: { type: string }
              label: { type: string }
              count: { type: integer, description: Negative comments in the theme }
              percent: { type: [integer, 'null'], description: Share of all negative comments }
        run:
          type: object
          required: [grouper, writer, llm_calls]
          properties:
            grouper: { type: [string, 'null'], description: Null in direct mode }
            writer: { type: string, example: Mock (no LLM connected) }
            llm_calls: { type: integer }
    ResponsesPage:
      type: object
      required: [total, rows]
      properties:
        total: { type: integer, minimum: 0, description: Responses matching the filters }
        rows:
          type: array
          items:
            type: object
            required: [id, display_id, submitted_at, answer, reason, comment, masked, segment_label]
            properties:
              id: { type: string, format: uuid }
              display_id: { type: string, example: R-5337A1 }
              submitted_at: { type: string, format: date-time }
              answer: { type: [integer, 'null'], description: Answer to the first scale question }
              reason: { type: [string, 'null'], description: Picked reasons joined with "; " }
              comment: { type: [string, 'null'], description: First text question, emails and phone numbers hidden }
              masked: { type: boolean, description: True when something in the comment was hidden }
              segment_label: { type: [string, 'null'], description: Null when segments are off }
    ResponseDetail:
      type: object
      required: [display_id, submitted_at, segment_label, answers]
      properties:
        display_id: { type: string }
        submitted_at: { type: string, format: date-time }
        segment_label: { type: [string, 'null'] }
        answers:
          type: array
          items:
            type: object
            required: [question_id, prompt, kind, value, masked]
            properties:
              question_id: { type: string, format: uuid }
              prompt: { type: string }
              kind: { $ref: '#/components/schemas/QuestionKind' }
              value:
                description: A number, text, the picked options, or null when unanswered
                oneOf:
                  - { type: number }
                  - { type: string }
                  - { type: array, items: { type: string } }
                  - { type: 'null' }
              masked: { type: boolean }
    SurveyOverview:
      type: object
      required: [survey_id, title, type, status, closes_at, last_answer_at, channels, segment, segments, responses, views, response_rate, completed_all, main, questions, reasons, trend, by_segment]
      properties:
        survey_id: { type: string, format: uuid }
        title: { type: string }
        type: { $ref: '#/components/schemas/SurveyType' }
        status: { $ref: '#/components/schemas/SurveyStatus' }
        closes_at: { type: [string, 'null'], format: date-time }
        last_answer_at: { type: [string, 'null'], format: date-time }
        channels: { type: array, items: { type: string, enum: [email, link, qr] }, description: Channels with views or answers }
        segment: { type: string, description: The segment filter that was applied }
        segments:
          type: array
          description: Segments that can be chosen. Empty when there are fewer than 2.
          items:
            type: object
            required: [value, label, answers]
            properties:
              value: { type: string, example: members }
              label: { type: string, example: Members }
              answers: { type: integer }
        responses: { type: integer, minimum: 0 }
        views: { type: integer, minimum: 0, description: Views of all channels }
        response_rate: { type: [integer, 'null'], description: Whole percent. Null when a segment is chosen or there are no views. }
        completed_all: { type: [integer, 'null'], description: Percent of responses that answered every question. Custom surveys only. }
        main:
          type: [object, 'null']
          description: The first nps, thumbs or rating question. Null when the survey has none.
          required: [question_id, kind, score, change, counts]
          properties:
            question_id: { type: string, format: uuid }
            kind: { type: string, enum: [nps, thumbs, rating] }
            score: { type: [integer, 'null'], description: 'NPS, thumbs positive % or rating satisfied %. All-time for the chosen segment.' }
            change: { type: [integer, 'null'], description: Score now minus the score at the end of the previous month. Null when nothing was answered before this month. }
            counts: { type: object, additionalProperties: { type: integer }, description: Answers per scale value }
        questions:
          type: array
          items:
            type: object
            required: [id, kind, prompt, required, answers, options, average]
            properties:
              id: { type: string, format: uuid }
              kind: { $ref: '#/components/schemas/QuestionKind' }
              prompt: { type: string }
              required: { type: boolean }
              answers: { type: integer }
              options:
                type: array
                description: Every scale value, or the question's options. A multiple-choice option counts once per response. Empty for text.
                items:
                  type: object
                  required: [label, count]
                  properties:
                    label: { type: string }
                    count: { type: integer }
              average: { type: [number, 'null'], description: Scale questions only, one decimal }
        reasons:
          type: array
          description: From the first reasons question, most picked first
          items:
            type: object
            required: [label, count, percent]
            properties:
              label: { type: string }
              count: { type: integer }
              percent: { type: [integer, 'null'], description: Of the responses that answered the question }
        trend:
          type: array
          description: Main score per month, oldest first. Empty when fewer than 2 months have answers.
          items:
            type: object
            required: [month, score, answers]
            properties:
              month: { type: string, example: 2026-11 }
              score: { type: [integer, 'null'] }
              answers: { type: integer }
        by_segment:
          type: array
          description: Main score per segment. Empty when there are fewer than 2 segments.
          items:
            type: object
            required: [value, label, answers, score, counts]
            properties:
              value: { type: string }
              label: { type: string }
              answers: { type: integer }
              score: { type: [integer, 'null'] }
              counts: { type: object, additionalProperties: { type: integer } }
    QuestionKind:
      type: string
      enum: [single_choice, multiple_choice, dropdown, text, long_text, rating, nps, reasons, thumbs]
      description: >-
        The prototype's answer types. single_choice = Multiple choice (pick one),
        multiple_choice = Checkboxes, dropdown = Dropdown, text = Short answer (answers up
        to 500 characters), long_text = Paragraph (up to 5000), rating = Rating 1-5 (CSAT),
        nps = NPS 0-10, reasons = Reason bubbles (pick any; each becomes a Top reasons
        category), thumbs = Thumbs rating (0 Not for me, 1 Good, 2 Loved it; the main
        question of a thumbs survey). Rating, NPS and thumbs scales are fixed.
    QuestionOptions:
      type: array
      maxItems: 20
      items: { type: string, minLength: 1, maxLength: 200 }
      description: >-
        Choice types (single_choice, multiple_choice, dropdown, reasons) need 1-20
        distinct options (spaces trimmed, case-insensitive duplicates rejected).
        Every other type has none.
    QuestionCreate:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { $ref: '#/components/schemas/QuestionKind' }
        prompt: { type: string, maxLength: 500, default: '', description: Trimmed }
        options: { $ref: '#/components/schemas/QuestionOptions' }
        required: { type: boolean, default: true }
    QuestionUpdate:
      type: object
      additionalProperties: false
      description: >-
        Fields left out stay the same; an empty body changes nothing. The type and options
        must fit together after the edit. Options left out are kept, except that switching
        to a type without options clears them.
      properties:
        kind: { $ref: '#/components/schemas/QuestionKind' }
        prompt: { type: string, maxLength: 500, description: Trimmed }
        options: { $ref: '#/components/schemas/QuestionOptions' }
        required: { type: boolean }
    QuestionOrder:
      type: object
      additionalProperties: false
      required: [question_ids]
      properties:
        question_ids:
          type: array
          items: { type: string, format: uuid }
          uniqueItems: true
    Question:
      type: object
      required: [id, survey_id, position, kind, prompt, options, required]
      properties:
        id: { type: string, format: uuid }
        survey_id: { type: string, format: uuid }
        position: { type: integer, minimum: 1 }
        kind: { $ref: '#/components/schemas/QuestionKind' }
        prompt: { type: string }
        options: { $ref: '#/components/schemas/QuestionOptions' }
        required: { type: boolean }
    TemplateQuestion:
      type: object
      required: [kind, prompt, options, required]
      properties:
        kind: { $ref: '#/components/schemas/QuestionKind' }
        prompt: { type: string }
        options: { $ref: '#/components/schemas/QuestionOptions' }
        required: { type: boolean }
    Template:
      type: object
      required: [id, name, type, description, thank_you, featured, own, questions]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Member NPS }
        type: { $ref: '#/components/schemas/SurveyType' }
        description: { type: string, example: Yearly loyalty check for members }
        thank_you: { type: string, description: Empty when the template has none }
        featured: { type: boolean, description: Shown as a card on the Templates page }
        own: { type: boolean, description: Saved by the organisation; false for built-in templates, which are read-only }
        questions:
          type: array
          description: >-
            The first is the main question. Thumbs, NPS and CSAT templates follow it with
            optional reason bubbles.
          items: { $ref: '#/components/schemas/TemplateQuestion' }
    TemplateCreate:
      type: object
      additionalProperties: false
      required: [survey_id, name]
      properties:
        survey_id: { type: string, format: uuid, description: The survey to save as a template }
        name: { type: string, minLength: 1, maxLength: 80, description: Trimmed }
        description: { type: string, maxLength: 1000, default: '', description: Trimmed }
    TemplateUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80, description: Trimmed }
        description: { type: string, maxLength: 1000, description: Trimmed; an empty string clears it }
