[project]
name = "respondent"
version = "0.1.0"
description = "Respondent Survey Service: public answer path (verify link token, queue the answer, thank-you page)."
requires-python = ">=3.12"
dependencies = [
  "liana-survey-shared[web]",
  "aio-pika>=9.4,<10",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["respondent_service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a migrated Postgres reached as the app role"]
