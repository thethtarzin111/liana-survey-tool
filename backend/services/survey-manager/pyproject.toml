[project]
name = "survey-manager"
version = "0.1.0"
description = "Survey Manager service: surveys, questions, templates, publishing and links."
requires-python = ">=3.12"
dependencies = [
  "liana-survey-shared[web]",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "aio-pika>=9.4,<10",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["survey_manager*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "db: needs a migrated Postgres (DATABASE_URL as the app role); skipped when none answers",
]
