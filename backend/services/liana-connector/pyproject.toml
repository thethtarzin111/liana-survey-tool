[project]
name = "liana-connector"
version = "0.1.0"
description = "The only component that talks to other Liana products (ports and adapters)."
requires-python = ">=3.12"
dependencies = ["liana-survey-shared", "aio-pika>=9.4,<10", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.8,<1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["liana_connector*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
