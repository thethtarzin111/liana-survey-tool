[project]
name = "data-analyzer"
version = "0.1.0"
description = "Data Analyzer service: NPS/CSAT results and analysed data; sends identified answers and contact requests to the integration queue."
requires-python = ">=3.12"
dependencies = [
  "liana-survey-shared[web]",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["data_analyzer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
