name: E2E

# Starts the native development stack and runs Playwright.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install native PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-contrib libpq-dev
          echo "POSTGRES_BIN=$(pg_config --bindir)" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Start the stack
        run: |
          mkdir -p .local
          .venv/bin/python -u -m backend.scripts.local_dev > .local/e2e.log 2>&1 &
          echo $! > .local/e2e.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health/ready && curl -fsS http://127.0.0.1:4200/ > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat .local/e2e.pid)" 2>/dev/null; then
              cat .local/e2e.log
              exit 1
            fi
            sleep 1
          done
          cat .local/e2e.log
          exit 1
      - run: make e2e
      - name: Logs on failure
        if: failure()
        run: cat .local/e2e.log .local/postgres.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
      - name: Stop the stack
        if: always()
        run: |
          if [ -f .local/e2e.pid ]; then
            kill -TERM "$(cat .local/e2e.pid)" 2>/dev/null || true
            for attempt in $(seq 1 20); do
              kill -0 "$(cat .local/e2e.pid)" 2>/dev/null || break
              sleep 1
            done
          fi
