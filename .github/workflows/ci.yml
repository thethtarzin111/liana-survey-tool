name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token. paths-filter needs pull-requests: read to list the PR's files.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      web: ${{ steps.filter.outputs.web }}
      db: ${{ steps.filter.outputs.db }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # Changes to CI, launch scripts or env settings run every job.
            shared: &shared
              - '.github/workflows/**'
              - 'scripts/**'
              - 'package.json'
              - 'package-lock.json'
              - '.env.example'
              - 'Makefile'
            python:
              - *shared
              - 'backend/scripts/**'
              - 'backend/packages/**'
              - 'backend/services/**'
              - 'ruff.toml'
            web:
              - *shared
              - 'frontend/**'
            # The API's database tests run in the db job, so API changes run it too.
            db:
              - *shared
              - 'backend/db/**'
              - 'backend/infra/postgres/**'
              - 'backend/services/survey-manager/**'
              - 'backend/packages/shared-py/**'

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: make install-py
      - run: make lint-py
      - run: make test-py

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make install-web
      - run: make lint-web
      - run: make test-web
      - run: cd frontend && npm run build

  # Applies the migrations and seed data to a real Postgres and checks that
  # row-level security hides other tenants' rows.
  db:
    needs: changes
    if: needs.changes.outputs.db == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      PGHOST: localhost
      PGUSER: survey_owner
      PGPASSWORD: ci-owner
      PGDATABASE: survey
      POSTGRES_USER: survey_owner
      POSTGRES_DB: survey
      APP_DB_USER: survey_app
      APP_DB_PASSWORD: ci-app
    steps:
      - uses: actions/checkout@v4
      - name: Start native PostgreSQL and create the schema owner
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-contrib
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE survey_owner LOGIN SUPERUSER PASSWORD 'ci-owner';"
          sudo -u postgres createdb --owner=survey_owner survey
      - name: Create app role
        run: sh backend/infra/postgres/init/01-app-role.sh
      - name: Install dbmate
        run: |
          sudo curl -fsSL -o /usr/local/bin/dbmate https://github.com/amacneil/dbmate/releases/download/v2.21.0/dbmate-linux-amd64
          sudo chmod +x /usr/local/bin/dbmate
      - name: Migrate up, down, up
        env:
          DATABASE_URL: postgres://survey_owner:ci-owner@localhost:5432/survey?sslmode=disable
        run: |
          dbmate --migrations-dir backend/db/migrations --no-dump-schema up
          dbmate --migrations-dir backend/db/migrations --no-dump-schema rollback
          dbmate --migrations-dir backend/db/migrations --no-dump-schema up
      - name: Seed twice (must be repeatable)
        run: |
          psql -v ON_ERROR_STOP=1 -f backend/db/seed/seed.sql
          psql -v ON_ERROR_STOP=1 -f backend/db/seed/seed.sql
      - name: Row-level security check
        env:
          PGUSER: survey_app
          PGPASSWORD: ci-app
        run: psql -v ON_ERROR_STOP=1 -f backend/db/tests/rls_check.sql
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: make install-py
      - name: Survey manager tests against the database (as the app role, so RLS applies)
        env:
          DATABASE_URL: postgresql://survey_app:ci-app@localhost:5432/survey
          REQUIRE_DB: '1'
        run: cd backend/services/survey-manager && python -m pytest -q -m db -rs
      - name: Worker tests against the database (answers saved per tenant, counted once)
        env:
          DATABASE_URL: postgresql://survey_app:ci-app@localhost:5432/survey
          REQUIRE_DB: '1'
        run: cd backend/services/worker && python -m pytest -q -m db -rs
      - name: Respondent tests against the database (answer links, open surveys)
        env:
          DATABASE_URL: postgresql://survey_app:ci-app@localhost:5432/survey
          REQUIRE_DB: '1'
        run: cd backend/services/respondent && python -m pytest -q -m db -rs
